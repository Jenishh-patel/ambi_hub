{% extends 'base.html' %}

{% block title %}Password Reset Complete - Ambitious Hub{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Password Reset Complete</h2>
        <p>Your password has been successfully reset. You can now log in with your new password.</p>
        <p class="auth-link">
            <a href="{% url 'login' %}" class="btn btn-primary btn-block">Go to Login</a>
        </p>
    </div>
</div>
{% endblock %}
